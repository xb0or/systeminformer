name: 'zh-cn-build'

on:
  workflow_dispatch:
  push:
    branches: ['master', 'main', 'l10n-zh-cn']
    tags: ['v*']

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      matrix:
        os: ['windows-2025-vs2026']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: NuGet Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: |
            packages
            ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Nuget Restore
        shell: cmd
        working-directory: ${{github.workspace}}
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: BuildTools Cache
        id: custombuildtool-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: tools/CustomBuildTool/bin/Release/**
          key: custombuildtool-${{ runner.os }}-${{ hashFiles('tools/CustomBuildTool/**', '!tools/CustomBuildTool/bin/**') }}
          restore-keys: custombuildtool-${{ runner.os }}-

      - name: BuildThirdParty Cache
        id: thirdparty-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: tools/thirdparty/**
          key: thirdparty-${{ runner.os }}-${{ hashFiles('tools/thirdparty/**', '!tools/thirdparty/bin/**') }}
          restore-keys: thirdparty-${{ runner.os }}-

      - name: Build Tools
        if: steps.custombuildtool-cache.outputs.cache-hit != 'true' || steps.thirdparty-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: ${{github.workspace}}
        run: build\build_init.cmd

      - name: Build Solution (Release)
        shell: cmd
        working-directory: ${{github.workspace}}
        run: build\build_release.cmd

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          name: systeminformer-zh-cn-bin
          path: |
            build/output/*bin.zip
            build/output/*setup*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          name: systeminformer-zh-cn-full
          path: build/output/*
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $lines = @(
            '简体中文汉化版 / Simplified Chinese localization build.',
            '',
            '下载对应架构的压缩包解压即可使用（免安装）。 / Download the archive for your architecture, extract and run (portable).',
            '',
            '- systeminformer-build-win64-bin.zip - 64 位便携版 / 64-bit portable',
            '- systeminformer-build-win32-bin.zip - 32 位便携版 / 32-bit portable',
            '- systeminformer-build-arm64-bin.zip - ARM64 便携版 / ARM64 portable',
            '- systeminformer-build-release-setup.exe - 安装程序 / Setup',
            '- systeminformer-build-canary-setup.exe - Canary 安装程序 / Canary setup'
          )
          $notes = $lines -join [Environment]::NewLine
          gh release create $tag --title "System Informer 简体中文版 $tag" --notes $notes build/output/*bin.zip build/output/*setup*.exe
        env:
          GH_TOKEN: ${{ github.token }}
