name: 'zh-cn-build'

on:
  workflow_dispatch:
  push:
    branches: ['master', 'main', 'l10n-zh-cn']

jobs:
  build-release:
    permissions:
      contents: read
    strategy:
      matrix:
        os: ['windows-2025-vs2026']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: NuGet Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: |
            packages
            ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Nuget Restore
        shell: cmd
        working-directory: ${{github.workspace}}
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: BuildTools Cache
        id: custombuildtool-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: tools/CustomBuildTool/bin/Release/**
          key: custombuildtool-${{ runner.os }}-${{ hashFiles('tools/CustomBuildTool/**', '!tools/CustomBuildTool/bin/**') }}
          restore-keys: custombuildtool-${{ runner.os }}-

      - name: BuildThirdParty Cache
        id: thirdparty-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: tools/thirdparty/**
          key: thirdparty-${{ runner.os }}-${{ hashFiles('tools/thirdparty/**', '!tools/thirdparty/bin/**') }}
          restore-keys: thirdparty-${{ runner.os }}-

      - name: Build Tools
        if: steps.custombuildtool-cache.outputs.cache-hit != 'true' || steps.thirdparty-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: ${{github.workspace}}
        run: build\build_init.cmd

      - name: Build Solution (Release)
        shell: cmd
        working-directory: ${{github.workspace}}
        run: build\build_release.cmd

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          name: systeminformer-zh-cn-${{ matrix.os }}
          path: build/output/*
          if-no-files-found: error
          retention-days: 14
